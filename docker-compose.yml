services:
# 1. Streamlit UI (frontend) / Python execution container
  # 2. Streamlit UI (frontend) / Python execution container
  dashboard: # Add streamlit service
    build: .
    container_name: poke_dashboard
    environment:
      # Pass the unified Supabase URL directly from your .env file
      - DATABASE_URL=${DATABASE_URL} 
      - HF_TOKEN=${HF_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    # REMOVED: depends_on: poke_db (No longer needed!)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./:/app           # Syncs your entire project folder
      - ./logs:/app/logs  # Explicitly syncs the logs directory
    # ------------------------------
    # Overrride Dockerfile ENTRYPOINT to run Streamlit
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.address=0.0.0.0"]

# REMOVED: volumes: postgres_data (You don't need local database storage anymore!)