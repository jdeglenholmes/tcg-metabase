name: Unified Database Backup

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 2:00 AM UTC every day
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (pg_dump 17)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          sudo rm -f /usr/bin/pg_dump
          sudo ln -s /usr/lib/postgresql/17/bin/pg_dump /usr/bin/pg_dump

      - name: Install Python Dependencies
        run: pip install psycopg2-binary python-dotenv

      - name: Run Unified Backup Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/scripts/backup_postgres_data.py

      - name: Upload Backups as Artifacts (Retained for 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backups
          path: |
            backups/*.dump
            backups/*.json
          retention-days: 30